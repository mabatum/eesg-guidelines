name: Sync Yandex Wiki and Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .sync-trigger

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: eesg-publish
  cancel-in-progress: false

jobs:
  sync-build:
    runs-on: ubuntu-latest
    env:
      ROOT_SLUG: eesg
      ORG_ID: bpfl6jh90pruinc9ks8c
      WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Import EESG brand assets
        run: python scripts/import_eesg_brand.py

      - name: Install Diplodoc dependencies
        run: npm install --no-audit --no-fund

      - name: Export Wiki subtree
        run: python scripts/export_wiki_neutral.py

      - name: Split portal navigation from guidelines
        run: python scripts/split_portal_navigation.py

      - name: Normalize literature links
        run: python scripts/normalize_literature_links.py

      - name: Generate recent updates
        run: python scripts/generate_recent_updates.py

      - name: Generate dynamic homepage
        run: python scripts/generate_homepage.py

      - name: Generate title and alias search index
        run: python scripts/generate_search_index.py

      - name: Validate exported content
        run: python scripts/validate_export.py

      - name: Literature QC
        run: |
          python scripts/literature_qc.py --check-external
          cat build/literature-qc.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload literature QC report
        uses: actions/upload-artifact@v4
        with:
          name: eesg-literature-qc
          path: |
            build/literature-qc.md
            build/literature-qc.json
          if-no-files-found: error
          retention-days: 30

      - name: Build Diplodoc static site
        run: npm run build:docs

      - name: Validate built routes
        run: python scripts/validate_static_routes.py

      - name: Upload site preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: eesg-site-preview
          path: './docs-html'
          if-no-files-found: error

      - name: Prepare PDF build
        id: pdf_prepare
        continue-on-error: true
        run: npm run build:pdf-input

      - name: Generate PDF
        id: pdf_generate
        if: steps.pdf_prepare.outcome == 'success'
        continue-on-error: true
        run: npm run build:pdf

      - name: Upload PDF artifact
        if: steps.pdf_generate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: eesg-guidelines-pdf
          path: './docs-pdf/**/*.pdf'
          if-no-files-found: warn
          retention-days: 30

      - name: Commit synced content
        run: |
          git config user.name "eesg-wiki-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add docs/gen_docs docs/updates.md docs/_assets/script/search-index-v3.js docs/_assets/brand
          if git diff --cached --quiet; then
            echo "No Wiki/search/updates/brand changes to commit."
          else
            git commit -m "Sync EESG content and generated indexes"
            git pull --rebase origin main
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './docs-html'

  deploy:
    needs: sync-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

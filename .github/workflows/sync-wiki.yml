name: Publish EESG bone guidelines

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'content-reviewed/**'
      - 'docs/**'
      - 'scripts/**'
      - 'new-interface/**'
      - 'config/**'
      - 'package.json'
      - 'package-lock.json'
      - 'requirements.txt'
      - '.github/workflows/sync-wiki.yml'
  schedule:
    # The bone text is edited in Wiki; pick up the edits every 30 minutes.
    - cron: '*/30 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: eesg-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Export Wiki
        # The text of every published page is edited in Wiki. If Wiki is unreachable,
        # the job stops and the site keeps its last published version.
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          ORG_ID: bpfl6jh90pruinc9ks8c
        run: |
          pip install -r requirements.txt
          python3 scripts/export_wiki_neutral.py
          python3 scripts/pull_wiki_bones.py
      - name: Prepare reviewed bone content and navigation
        run: npm run prepare:docs
      - name: Build site
        run: npm run build:docs
      - name: Build new interface
        run: python3 scripts/build_new_interface.py
      - name: Validate routes, scope and source
        run: |
          python3 scripts/validate_static_routes.py
          python3 scripts/validate_clinical_source.py
          touch docs-html/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs-html
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

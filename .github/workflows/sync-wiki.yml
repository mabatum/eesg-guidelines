name: Sync Yandex Wiki and Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .sync-trigger

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: eesg-publish
  cancel-in-progress: false

jobs:
  sync-build:
    runs-on: ubuntu-latest
    env:
      ROOT_SLUG: eesg
      ORG_ID: bpfl6jh90pruinc9ks8c
      WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export Wiki subtree
        run: python scripts/export_wiki.py

      - name: Build Diplodoc static site
        uses: diplodoc-platform/docs-build-static-action@v1
        with:
          src-root: './docs'
          build-root: './docs-html'

      - name: Upload site preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: eesg-site-preview
          path: './docs-html'
          if-no-files-found: error

      - name: Commit synced content
        run: |
          git config user.name "eesg-wiki-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add docs/gen_docs
          if git diff --cached --quiet; then
            echo "No Wiki changes to commit."
          else
            git commit -m "Sync EESG content from Yandex Wiki"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './docs-html'

  deploy:
    needs: sync-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

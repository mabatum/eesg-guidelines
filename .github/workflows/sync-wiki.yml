name: EESG Site Closed

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-wiki.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: eesg-publish
  cancel-in-progress: true

jobs:
  deploy-closed:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Prepare closed site
        run: |
          mkdir -p site-closed
          cat > site-closed/404.html <<'EOF'
          <!doctype html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <meta name="robots" content="noindex, nofollow, noarchive">
            <title>Not Found</title>
          </head>
          <body></body>
          </html>
          EOF
          touch site-closed/.nojekyll

      - name: Upload closed Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site-closed'

      - name: Deploy closed site
        id: deployment
        uses: actions/deploy-pages@v4

name: Sync Yandex Wiki

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .sync-trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      ROOT_SLUG: eesg
      ORG_ID: bpfl6jh90pruinc9ks8c
      WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export Wiki subtree
        run: python scripts/export_wiki.py

      - name: Commit synced content
        run: |
          git config user.name "eesg-wiki-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add docs/gen_docs
          if git diff --cached --quiet; then
            echo "No Wiki changes to commit."
          else
            git commit -m "Sync EESG content from Yandex Wiki"
            git push
          fi
